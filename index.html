<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GTA 6 Intro</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    .tela {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    /* Zoom leve para esconder barras/cantos do YouTube e manter o foco no vídeo */
    .tela iframe {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 118vw;
      height: 118vh;
      border: 0;
      pointer-events: none;
      transform: translate(-50%, -50%) scale(1.06);
      transform-origin: center center;
    }
  </style>
</head>
<body>
  <div class="tela">
    <iframe
      src="https://www.youtube.com/embed/q82G5FUaHf0?start=0&end=15&autoplay=1&mute=0&controls=0&playsinline=1&rel=0&modestbranding=1&iv_load_policy=3&disablekb=1"
      title="GTA 6 Intro"
      allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen>
    </iframe>
  </div>
</body>
</html>
